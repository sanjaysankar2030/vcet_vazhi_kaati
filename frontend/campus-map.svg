<svg id="campus-map" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
    <style>
        .wall { fill: #000000; }
        .corridor { fill: #ffffff; }
        .text-main { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000033; text-anchor: middle; alignment-baseline: middle; }
        .text-sm { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000033; text-anchor: middle; alignment-baseline: middle; }
        .text-xs { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #000033; text-anchor: middle; alignment-baseline: middle; }
        .direction-box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 8; }
        .direction-text { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #000000; text-anchor: middle; alignment-baseline: middle; }
        .path-line { fill: none; stroke: #0066ff; stroke-width: 3; stroke-dasharray: 8, 5; }
        .path-node { fill: #ffffff; stroke: #ff0000; stroke-width: 3; r: 6; }
    </style>

    <g id="map-content">
        <!-- Structural Corridors & Walls -->
        <rect id="wall-outer" class="wall" x="80" y="80" width="1040" height="740" />
        <rect id="corridor-outer" class="corridor" x="100" y="100" width="1000" height="700" />
        <rect id="wall-center" class="wall" x="490" y="340" width="220" height="280" />
        <rect id="corridor-center" class="corridor" x="500" y="350" width="200" height="260" />

        <!-- Courtyard Circles -->
        <circle cx="600" cy="480" r="30" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
        <circle cx="600" cy="480" r="20" fill="#a0c4ff" stroke="#000000" stroke-width="2"/>
        <circle cx="600" cy="480" r="10" fill="#f4e04d" stroke="#000000" stroke-width="1"/>

        <!-- Grass Lawns -->
        <rect id="grass-east-border" x="740" y="340" width="200" height="300" fill="#000000" />
        <rect id="grass-east" x="750" y="350" width="180" height="280" fill="#73d936" stroke="#000000" stroke-width="2"/>
        <rect id="grass-west-border" x="360" y="350" width="90" height="150" fill="#000000" />
        <rect id="grass-west" x="370" y="360" width="70" height="130" fill="#73d936" stroke="#000000" stroke-width="2"/>

        <!-- Trees -->
        <circle cx="830" cy="400" r="20" fill="#2d6a4f" stroke="#000000" stroke-width="2"/>
        <circle cx="860" cy="420" r="15" fill="#1b4332" stroke="#000000" stroke-width="2"/>
        <circle cx="780" cy="580" r="20" fill="#2d6a4f" stroke="#000000" stroke-width="2"/>
        <circle cx="810" cy="600" r="18" fill="#1b4332" stroke="#000000" stroke-width="2"/>

        <!-- Obstacles -->
        <rect id="obstacle-top-left" x="260" y="165" width="65" height="70" fill="#e0e0e0" stroke="#000000" stroke-width="3"/>
        <rect id="obstacle-green" x="230" y="275" width="50" height="45" fill="#73d936" stroke="#000000" stroke-width="3"/>
        <circle cx="245" cy="290" r="5" fill="#ff0000"/>
        <circle cx="265" cy="305" r="5" fill="#ff0000"/>
        <rect id="obstacle-mid-right" x="895" y="200" width="55" height="70" fill="#e0e0e0" stroke="#000000" stroke-width="3"/>

