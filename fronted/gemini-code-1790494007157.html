        .direction-text { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #000000; text-anchor: middle; alignment-baseline: middle; }

        window.onload = function() {
            window.panZoom = svgPanZoom('#campus-map', {
                zoomEnabled: true,
                controlIconsEnabled: true,
                fit: true,
                center: true,
                minZoom: 0.5,
                maxZoom: 10
            });
        };

        // Graph coordinate map
        const nodes = {
            'N_Recpt_Door': { x: 600, y: 660 }, 'N_Recpt_Hall': { x: 600, y: 680 },
            'N_Bot_Lib': { x: 470, y: 680 }, 'N_Bot_Math': { x: 365, y: 680 },
            'N_Bot_Know': { x: 280, y: 680 }, 'BL_Corner': { x: 200, y: 680 },
            'N_Left_Board': { x: 200, y: 550 }, 'N_Left_Stage': { x: 200, y: 450 },
            'N_Left_AIDS': { x: 200, y: 350 }, 'N_Left_CDC': { x: 200, y: 275 },
            'W1': { x: 200, y: 240 }, 'W2': { x: 215, y: 240 }, 'W3': { x: 215, y: 260 },
            'W4': { x: 295, y: 260 }, 'W5': { x: 295, y: 235 }, 'W6': { x: 340, y: 235 },
            'TL_Corner': { x: 340, y: 165 }, 'N_Top_DS': { x: 470, y: 165 },
            'N_Top_Mid': { x: 600, y: 165 }, 'N_Top_Core': { x: 735, y: 165 },
            'N_Top_Yuv': { x: 875, y: 165 }, 'TR_Corner': { x: 1000, y: 165 },
            'N_Right_SDC': { x: 1000, y: 225 }, 'N_Right_Lift': { x: 1000, y: 315 },
            'N_Right_Rest': { x: 1000, y: 390 }, 'N_Right_Sec': { x: 1000, y: 460 },
            'N_Right_Stair': { x: 1000, y: 540 }, 'N_Right_Princ': { x: 1000, y: 610 },
            'BR_Corner': { x: 1000, y: 680 }, 'N_Bot_Admin': { x: 870, y: 680 }, 
            'N_Bot_Cash': { x: 735, y: 680 }
        };

        const edges = [
            ['N_Recpt_Door', 'N_Recpt_Hall'], ['N_Recpt_Hall', 'N_Bot_Lib'], ['N_Bot_Lib', 'N_Bot_Math'],
            ['N_Bot_Math', 'N_Bot_Know'], ['N_Bot_Know', 'BL_Corner'], ['BL_Corner', 'N_Left_Board'],
            ['N_Left_Board', 'N_Left_Stage'], ['N_Left_Stage', 'N_Left_AIDS'], ['N_Left_AIDS', 'N_Left_CDC'],
            ['N_Left_CDC', 'W1'], ['W1', 'W2'], ['W2', 'W3'], ['W3', 'W4'], ['W4', 'W5'], ['W5', 'W6'],
            ['W6', 'TL_Corner'], ['TL_Corner', 'N_Top_DS'], ['N_Top_DS', 'N_Top_Mid'], ['N_Top_Mid', 'N_Top_Core'],
            ['N_Top_Core', 'N_Top_Yuv'], ['N_Top_Yuv', 'TR_Corner'], ['TR_Corner', 'N_Right_SDC'],
            ['N_Right_SDC', 'N_Right_Lift'], ['N_Right_Lift', 'N_Right_Rest'], ['N_Right_Rest', 'N_Right_Sec'],
            ['N_Right_Sec', 'N_Right_Stair'], ['N_Right_Stair', 'N_Right_Princ'], ['N_Right_Princ', 'BR_Corner'],
            ['BR_Corner', 'N_Bot_Admin'], ['N_Bot_Admin', 'N_Bot_Cash'], ['N_Bot_Cash', 'N_Recpt_Hall']
        ];

        const locationMap = {
            'MainEntrance': 'N_Recpt_Hall', 'Reception': 'N_Recpt_Door', 'SecondEntrance': 'N_Right_Sec',
            'ElectricalCabin': 'TL_Corner', 'AILab': 'TL_Corner', 'DSLab': 'N_Top_DS',
            'CoreSpace': 'N_Top_Yuv', 'YuvarajSir': 'TR_Corner', 'CDCHall': 'W1',
            'StudentRestEast': 'N_Left_CDC', 'AIDS_B': 'N_Left_AIDS', 'AIDS_A': 'N_Left_Stage',
            'CSEC': 'N_Left_Stage', 'LiftEast': 'N_Left_Board', 'StaircaseEast': 'N_Left_Board',
            'NewBuilding': 'BL_Corner', 'SDCHall': 'N_Right_SDC', 'LiftWest': 'N_Right_Lift',
            'StudentRestWest': 'N_Right_Rest', 'StaircaseWest': 'N_Right_Stair', 
            'PrincipalRoom': 'N_Right_Princ', 'StaffRestRoom': 'BR_Corner',
            'KnowledgeHub': 'N_Bot_Know', 'MathLab': 'N_Bot_Math', 'Library': 'N_Bot_Lib',
            'CashCounter': 'N_Bot_Cash', 'AdmissionCentre': 'N_Bot_Admin', 'ScholarshipCounter': 'BR_Corner',
            'AmphiTheatre': 'N_Top_Mid', 'ViscomHall': 'N_Top_Core', 'Stage': 'N_Left_Stage',
            'BoardRoom': 'N_Bot_Know', 'IdeaHub': 'N_Bot_Math'
        };

        let currentAnimation = null;

        function findShortestPath(startNode, endNode) {
            const distances = {}, prev = {}, queue = [];
            for (let v in nodes) { distances[v] = Infinity; prev[v] = null; queue.push(v); }
            distances[startNode] = 0;

            while (queue.length > 0) {
                queue.sort((a, b) => distances[a] - distances[b]);
                const u = queue.shift();
                if (u === endNode) break;

                edges.forEach(edge => {
                    if (edge.includes(u)) {
                        const neighbor = edge[0] === u ? edge[1] : edge[0];
                        if (queue.includes(neighbor)) {
                            const dist = Math.hypot(nodes[u].x - nodes[neighbor].x, nodes[u].y - nodes[neighbor].y);
                            if (distances[u] + dist < distances[neighbor]) { 
                                distances[neighbor] = distances[u] + dist; 
                                prev[neighbor] = u; 
                            }
                        }
                    }
                });
            }
            const path = []; let u = endNode;
            while (prev[u]) { path.unshift(u); u = prev[u]; }
            if (path.length > 0) path.unshift(startNode);
            return path;
        }

        document.getElementById('navigate-btn').addEventListener('click', () => {
            const src = document.getElementById('source').value;
            const dest = document.getElementById('destination').value;
            const status = document.getElementById('status');

            if (src === dest) {
                status.innerText = "Already at destination.";
                return;
            }

            const pathNodes = findShortestPath(locationMap[src], locationMap[dest]);
            
            if (pathNodes.length > 0) {
                const dot = document.getElementById('animated-dot');
                dot.style.display = 'block';
                status.innerText = "Routing...";
                
                if (currentAnimation) clearInterval(currentAnimation);
                
                let i = 0;
                dot.setAttribute('cx', nodes[pathNodes[0]].x);
                dot.setAttribute('cy', nodes[pathNodes[0]].y);

                currentAnimation = setInterval(() => {
                    i++;
                    if (i >= pathNodes.length) {
                        clearInterval(currentAnimation);
                        status.innerText = "Arrived!";
                        return;
                    }
                    dot.setAttribute('cx', nodes[pathNodes[i]].x);
                    dot.setAttribute('cy', nodes[pathNodes[i]].y);
                }, 400);
            }
        });
    </script>
</body>
</html>
