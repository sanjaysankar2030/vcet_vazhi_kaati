svg { background: #e0e0e0; }
.corridor-base { fill:none; stroke:#000; stroke-width:14; stroke-linejoin:round; stroke-linecap:round; }
.corridor-inner { fill:none; stroke:#fff; stroke-width:10; stroke-linejoin:round; stroke-linecap:round; }
.text-main { font-family:Arial,sans-serif; font-size:18px; font-weight:bold; fill:#000033; text-anchor:middle; alignment-baseline:middle; }
