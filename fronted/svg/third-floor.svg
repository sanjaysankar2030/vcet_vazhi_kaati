#animated-dot { fill:#0022aa; stroke:#fff; stroke-width:2; }
#live-dot { fill:#28a745; stroke:#fff; stroke-width:2; }
#pulse-ring { fill:none; stroke:#28a745; stroke-width:2; }
.room { stroke:#000; stroke-width:2.5; }
.room-label { font-family:Arial,sans-serif; font-size:11px; font-weight:bold; fill:#000033; text-anchor:middle; alignment-baseline:middle; }
.room-label-sm { font-family:Arial,sans-serif; font-size:9px; font-weight:bold; fill:#000033; text-anchor:middle; alignment-baseline:middle; }
.room-label-lg { font-family:Arial,sans-serif; font-size:13px; font-weight:bold; fill:#000033; text-anchor:middle; alignment-baseline:middle; }

